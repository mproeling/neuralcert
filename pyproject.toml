[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcert"
version = "0.12.2"
description = "Composable neural discovery, distillation, refinement and verification for number theory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "NeuralCert contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.1",
  "mpmath>=1.3",
  "python-flint>=0.6",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
neuralcert = "neuralcert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuralcert.data" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
